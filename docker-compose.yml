services:
  wordpressgenius:
    build: .
    image: wordpressgenius:latest
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-prod}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8501:8501"
    volumes:
      - wordpressgenius_data:/app/data
      - wordpressgenius_logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  health:
    image: wordpressgenius:latest
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-prod}
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "uvicorn", "health:app", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    volumes:
      - wordpressgenius_data:/app/data
      - wordpressgenius_logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  wordpressgenius_data:
  wordpressgenius_logs:
  redis_data:
